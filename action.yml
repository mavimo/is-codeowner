name: 'Is Codeowner'
description: >-
  Check whether a user owns every changed file according to CODEOWNERS (directly or via team membership).
  The caller must run actions/checkout first (fetch-depth: 0 is recommended so changed files can be
  detected on pull requests). The token needs read:org to resolve team owners (@org/team).
author: 'mavimo'
branding:
  icon: shield
  color: blue
inputs:
  user:
    description: 'GitHub login of the user to check'
    required: true
  files:
    description: >-
      Newline-separated list (or JSON array) of files to check. If empty, changed files are detected
      automatically with tj-actions/changed-files. An empty list yields result=true (vacuous).
    required: false
    default: ''
  codeowners:
    description: 'CODEOWNERS content. If empty, read from .github/CODEOWNERS, CODEOWNERS or docs/CODEOWNERS.'
    required: false
    default: ''
  token:
    description: 'Token used to look up team membership (needs read:org for team owners; unused for user-only CODEOWNERS)'
    required: false
    default: ${{ github.token }}
outputs:
  result:
    description: '"true" if the user owns every file (also when there are no files), otherwise "false"'
    value: ${{ steps.check.outputs.result }}
  unowned-files:
    description: 'Newline-separated files matched by no CODEOWNERS rule'
    value: ${{ steps.check.outputs.unowned-files }}
  not-owned-files:
    description: 'Newline-separated files owned by someone other than the user'
    value: ${{ steps.check.outputs.not-owned-files }}
runs:
  using: composite
  steps:
    - name: Detect changed files
      id: changed
      if: inputs.files == ''
      # v47.0.6 (released after the March 2025 CVE-2025-30066 compromise), pinned to a full commit SHA.
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
      with:
        separator: "\n"
        # Raw names: the output is only ever passed through env vars, never interpolated into a script.
        safe_output: false
        quotepath: false

    - name: Check CODEOWNERS ownership
      id: check
      shell: bash
      env:
        INPUT_USER: ${{ inputs.user }}
        # Deleted files are included: removing a file you do not own is a change you do not own.
        INPUT_FILES: ${{ inputs.files != '' && inputs.files || steps.changed.outputs.all_changed_and_modified_files }}
        INPUT_CODEOWNERS: ${{ inputs.codeowners }}
        INPUT_TOKEN: ${{ inputs.token }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js"
